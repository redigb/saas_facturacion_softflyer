# Softflyer completo para PROBAR en cualquier equipo: PostgreSQL + API PHP + cola + tiempo real + web.
#   docker compose up -d --build      → http://demo.localhost:3000
# Guía: docker/README.md. No es una configuración de producción (ver Doc. 10).
#
# Las claves de abajo son solo para pruebas locales. Para cambiarlas, crea un .env junto a
# este archivo (copia docker/.env.example); Docker Compose lo lee solo.

x-api-env: &api-env
  APP_NAME: Softflyer
  APP_ENV: local
  APP_DEBUG: "true"
  APP_KEY: ${APP_KEY:-base64:AitsSj08GuJM2+ORm8uZ+EDHgp3LQesttksaJImtOiw=}
  APP_URL: http://localhost:${API_PORT:-8000}
  APP_LOCALE: es
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: factura_softfly
  DB_USERNAME: softflyer_app
  DB_PASSWORD: ${DB_APP_PASSWORD:-softflyer_app_docker}
  DB_OWNER_USERNAME: softflyer_owner
  DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-softflyer_owner_docker}
  SOFTFLYER_DOMINIO_CENTRAL: localhost
  SOFTFLYER_FRONTEND_URL: http://localhost:${WEB_PORT:-3000}
  SANCTUM_EXPIRATION: "480"
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: local
  # Next llama a la API desde la red interna de Docker y reenvía el subdominio.
  TRUSTED_PROXIES: "*"
  PHP_CLI_SERVER_WORKERS: "4"
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: softflyer
  REVERB_APP_KEY: ${REVERB_APP_KEY:-340b0489b943230f1be8}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-564754f770db4060f886ba8f1b2d065ee4b7ee81}
  REVERB_HOST: reverb
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: "8080"
  REVERB_ALLOWED_ORIGINS: "*"
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_FROM_ADDRESS: no-responder@softflyer.local
  MAIL_FROM_NAME: Softflyer

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_docker}
      SOFTFLYER_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-softflyer_owner_docker}
      SOFTFLYER_APP_PASSWORD: ${DB_APP_PASSWORD:-softflyer_app_docker}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/01-softflyer.sh:/docker-entrypoint-initdb.d/01-softflyer.sh:ro
      - ./back-softflyer/database/setup/crear_bd_local.sql:/softflyer/crear_bd_local.sql:ro
    ports:
      # 5433 para no chocar con un PostgreSQL instalado en el equipo.
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d factura_softfly"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./back-softflyer
    image: softflyer-api
    restart: unless-stopped
    command: ["api"]
    environment: *api-env
    volumes:
      - api-storage:/app/storage/app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  worker:
    image: softflyer-api
    restart: unless-stopped
    command: ["worker"]
    environment: *api-env
    volumes:
      - api-storage:/app/storage/app
    depends_on:
      api:
        condition: service_healthy

  scheduler:
    image: softflyer-api
    restart: unless-stopped
    command: ["scheduler"]
    environment: *api-env
    volumes:
      - api-storage:/app/storage/app
    depends_on:
      api:
        condition: service_healthy

  reverb:
    image: softflyer-api
    restart: unless-stopped
    command: ["reverb"]
    environment: *api-env
    ports:
      - "${REVERB_PUBLIC_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./front-next
      args:
        NEXT_PUBLIC_REVERB_KEY: ${REVERB_APP_KEY:-340b0489b943230f1be8}
        NEXT_PUBLIC_REVERB_PORT: ${REVERB_PUBLIC_PORT:-8080}
        NEXT_PUBLIC_REVERB_SCHEME: http
    image: softflyer-web
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      APP_ROOT_DOMAIN: localhost:${WEB_PORT:-3000}
      APP_PROTOCOL: http
      PRUEBA_DIAS: "7"
      DEMO_SLUG: demo
      DEMO_CORREO: demo@softflyer.pe
      DEMO_CONTRASENA: demo-softflyer
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  # Suite del backend contra su propia base: docker compose run --rm test
  # Las variables van aquí y no en phpunit.xml porque las de Docker le ganan a las del XML.
  test:
    image: softflyer-api
    profiles: ["test"]
    command: ["php", "artisan", "test"]
    environment:
      <<: *api-env
      APP_ENV: testing
      BCRYPT_ROUNDS: "4"
      DB_DATABASE: factura_softfly_test
      BROADCAST_CONNECTION: "null"
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      LOG_CHANNEL: "null"
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  db-data:
  api-storage:
